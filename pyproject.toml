[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senior-brief"
version = "0.1.0"
description = "BYOK senior-engineer briefing pipeline and Chrome side panel."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "langgraph>=0.2.40",
  "cryptography>=43",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["briefing*"]

[tool.setuptools.package-data]
briefing = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
